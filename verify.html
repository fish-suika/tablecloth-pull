<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>検証 — テーブルクロス引き</title>
<style>
  body{font-family:"Yu Gothic UI",system-ui,sans-serif;background:#1c1c1e;color:#eee;padding:24px;line-height:1.7}
  h1{font-size:18px;margin-bottom:16px}
  .r{padding:4px 0;border-bottom:1px solid #333}
  .ok::before{content:"PASS ";color:#6bd07a;font-weight:bold}
  .ng::before{content:"FAIL ";color:#ff6b6b;font-weight:bold}
  .ng{color:#ffb0b0}
  .why{color:#ff8f8f;padding-left:3em;font-size:13px}
  #sum{margin-top:18px;font-size:16px;font-weight:bold}
</style>
</head>
<body>
<h1>テーブルクロス引き — 検証</h1>
<div id="out"></div>
<div id="sum"></div>
<script>
"use strict";
// ===== 調整用の数値（遊んで直す） =====
// 速さの単位は「画面の高さ／秒」。例：画面の半分を 0.125 秒でなぞる＝ 4
const CFG = {
  speedMax: 9,            // 速さメーターの右端
  minPull: 0.10,          // これ未満しか引かなかったら「引いていない」扱い（画面の高さの割合）
  window: 0.10,           // 速さを測る時間窓＝指を離す直前の何秒か
  startY: 0.42,           // この高さ（画面上端からの割合）より下で指を置いたときだけ受け付ける
  nearRatio: 0.12,        // 幅の端からこの割合以内ならギリギリ
  nearMin: 0.15,          // ギリギリの最小幅（速さの単位）
  widthScale: 1.3,        // すべての物の成功の幅に掛ける倍率（難しさのつまみ。大きいほど易しい）
  widen: 1.4,             // 最初の数テーブルは幅を広げる倍率
  widenTables: 3,         // 広げるテーブル数
  showZoneDefault: true,  // 成功の幅を引く前から見せるか（「幅」ボタンで切り替え）
  items: {
    // lo〜hi が「ちょうどいい速さ」。遅いと引きずられ、速いと跳ねる
    // 軽い物は速すぎると飛ぶ（上限が低い）、重い物は速めでないと引きずる（下限が高い）、背が高い物は幅が狭い
    paperCup: { name: '紙コップ', lo: 1.4, hi: 3.6 },
    plate:    { name: 'お皿', lo: 2.0, hi: 5.6 },
    glass:    { name: 'グラス', lo: 2.2, hi: 5.0 },
    candle:   { name: 'ろうそく', lo: 2.6, hi: 4.4 },
    pot:      { name: '鉄鍋', lo: 4.0, hi: 7.2 },
    cake:     { name: 'ケーキ', lo: 2.8, hi: 4.8 },
    tower:    { name: 'シャンパンタワー', lo: 3.0, hi: 4.6 },
  },
  // 難しさの目標：[連続数, そのテーブル全体の成功の幅の目標]（間は直線でつなぐ。20連続以降は最後の値）。
  // 載る物は、tier の条件を満たす組み合わせのうち、この目標の幅に近いものを選ぶ → 連続するほど幅が狭くなる
  difficulty: [[0, 4.7], [1, 3.7], [2, 2.9], [3, 2.7], [7, 2.3], [12, 1.7], [20, 1.0]],
  // 連続成功数ごとの載る物。upTo＝この連続数未満のあいだ。top＝目標に近い上位何個からランダムに選ぶか（既定3。1なら毎回いちばん近いもの＝序盤は決まった順）、count＝物の数、must＝このうち1つは必ず入れる、
  // minW＝幅の重なりがこれ未満になる組み合わせは出さない（理不尽防止）
  tiers: [
    { upTo: 3,  count: [1, 1], pool: ['paperCup', 'plate', 'glass'], minW: 0, top: 1 },
    { upTo: 7,  count: [2, 3], pool: ['plate', 'glass', 'paperCup', 'candle', 'pot'], minW: 1.0 },
    { upTo: 12, count: [1, 3], pool: ['cake', 'tower', 'candle', 'glass', 'plate', 'paperCup', 'pot'], must: ['cake', 'tower'], minW: 0.8 },
    { upTo: Infinity, count: [2, 3], pool: ['paperCup', 'plate', 'glass', 'candle', 'pot', 'cake', 'tower'], minW: 0.7 },
  ],
  // 褒め言葉：from 連続以上で使う。連続数が増えるほど大きく褒める。near はギリギリ成功のとき
  praise: {
    ok: [
      { from: 1,  words: ['お見事！', 'ナイス！', 'いい引き！'] },
      { from: 4,  words: ['すごい！', 'うまい！', 'さすが！'] },
      { from: 8,  words: ['天才！', '名人！', 'プロの技！'] },
      { from: 13, words: ['神業！', '伝説！', '人間国宝！'] },
      { from: 20, words: ['人間じゃない！', 'ありえない！', '世界一！'] },
    ],
    near: ['ギリギリ！', 'あぶなっ！', '神業！'],
    slow: ['ずるずる〜！', '遅すぎ！', '引きずった！'],
    fast: ['ロケット発射！', '速すぎ！', '飛んでった！'],
    milestoneEvery: 5,      // この連続数ごとに「N連続！」を大きく出す
    confettiMax: 80,        // 紙吹雪の最大数（3連続から出る）
  },
  // 割れたときの破片の色（[おもな色, 差し色]）
  shard: {
    paperCup: [0xffffff, 0xe8575a], plate: [0xf6efe3, 0xf29bb7], glass: [0xcfeeff, 0xff5d73], candle: [0xfff3d6, 0xffb43a],
    pot: [0x34353b, 0x888b94], cake: [0xfff0f3, 0xe03148], tower: [0xcfeeff, 0xffd86b],
  },
  // 画面の揺れ（カメラ）：pull＝引いた瞬間（速さに比例）、shatter＝割れた瞬間、milestone＝節目
  shake: { pull: 0.012, pullMax: 0.1, shatter: 0.16, milestone: 0.08, decay: 5 },
  // 演出の時間（秒）
  // 引く動きの長さ＝ durK ÷ 速さ（秒）を durMin〜durMax に収める。遅く引くと布もゆっくり動く
  // ギリギリ成功のスロー：slowScale 倍の速さで slowTime 秒（実時間）。そのあと nearPopAt 秒で褒め、nearHold 秒で次へ
  fx: { enter: 0.38, okHold: 0.7, failHold: 0.5, durK: 1.0, durMin: 0.16, durMax: 1.2,
        slowScale: 0.3, slowTime: 1.0, nearPopAt: 0.95, nearHold: 1.5 },
  world: { tableTop: 1.0, tableW: 3.4, tableD: 2.0, drape: 1.0, clothW: 3.9, slideX: 9 },
  // カメラ：横の画角を固定して、斜め上から見下ろす
  cam: { hfov: 36, pos: [0, 5.0, 6.6], look: [0, 1.5, 0.3] },
};
// ===== 判定ロジック（three.js を使わない。verify.html で検証する） =====

// 指の軌跡から速さを測る。trail は [{t(ms), y(画面の高さに対する割合・下向きが正), x}]
// 戻り値：{speed（画面の高さ/秒）, dist（始点からの下向きの距離）}
function measureSpeed(trail, cfg) {
  const n = trail.length;
  if (n < 2) return { speed: 0, dist: 0 };
  const last = trail[n - 1];
  const dist = last.y - trail[0].y;
  let base = last;
  for (let i = n - 2; i >= 0; i--) {
    if (last.t - trail[i].t <= cfg.window * 1000) base = trail[i]; else break;
  }
  if (base === last) base = trail[n - 2];
  const dt = Math.max((last.t - base.t) / 1000, 0.008);
  return { speed: Math.max(0, (last.y - base.y) / dt), dist };
}

// 物の「ちょうどいい速さ」の幅。最初の数テーブルは中心を保ったまま広げる
function itemRange(def, tableNo, cfg) {
  const c = (def.lo + def.hi) / 2, w = def.hi - def.lo;
  const k = (cfg.widthScale || 1) * (tableNo < cfg.widenTables ? cfg.widen : 1);
  return { lo: c - w * k / 2, hi: c + w * k / 2 };
}

// 載っている物の幅の重なり。重なりがなければ empty
function combineRanges(ranges) {
  let lo = -Infinity, hi = Infinity;
  for (const r of ranges) { lo = Math.max(lo, r.lo); hi = Math.min(hi, r.hi); }
  return { lo, hi, empty: lo > hi };
}

// 判定：{ result: 'ok'|'slow'|'fast', near: ギリギリか, off: 幅から外れた量 }
function judge(speed, range, cfg) {
  if (speed < range.lo) return { result: 'slow', near: false, off: range.lo - speed };
  if (speed > range.hi) return { result: 'fast', near: false, off: speed - range.hi };
  const m = Math.max(cfg.nearMin, (range.hi - range.lo) * cfg.nearRatio);
  return { result: 'ok', near: Math.min(speed - range.lo, range.hi - speed) < m, off: 0 };
}

// 引いている長さが足りないか
function isShortPull(dist, cfg) { return dist < cfg.minPull; }

// 速さ→メーター上の位置（0〜1）
function meterPos(speed, cfg) { return Math.min(1, Math.max(0, speed / cfg.speedMax)); }

// ---- 載る物の選び方（連続成功数に応じたエスカレート） ----
function tierOf(streak, cfg) { return cfg.tiers.find(t => streak < t.upTo); }

// 連続成功数 streak のテーブルに載せる物の id の配列。rng は 0〜1 の乱数（検証では固定の乱数を渡す）
// 難しさの目標の幅（連続数 → そのテーブル全体の成功の幅）。cfg.difficulty の点の間を直線でつなぐ
function targetWidth(streak, cfg) {
  const d = cfg.difficulty;
  if (streak <= d[0][0]) return d[0][1];
  for (let i = 1; i < d.length; i++) {
    if (streak <= d[i][0]) { const k = (streak - d[i - 1][0]) / (d[i][0] - d[i - 1][0]); return d[i - 1][1] + (d[i][1] - d[i - 1][1]) * k; }
  }
  return d[d.length - 1][1];
}
// 載せる物の組み合わせのテーブル全体の成功の幅（倍率はかけ、最初の数テーブルの広げは含めない）
function tableWidth(ids, cfg) { const r = combineRanges(ids.map(id => itemRange(cfg.items[id], 99, cfg))); return r.empty ? 0 : r.hi - r.lo; }

// 条件を満たす組み合わせを集め、目標の幅に近い順の上位 t.top（既定3）個からランダムに1つ選ぶ（毎回同じにならないように）
function pickTable(streak, rng, cfg) {
  const t = tierOf(streak, cfg), target = targetWidth(streak, cfg), seen = new Set(), cands = [];
  for (let k = 0; k < 80; k++) {
    const n = Math.min(t.pool.length, t.count[0] + Math.floor(rng() * (t.count[1] - t.count[0] + 1)));
    const ids = [];
    if (t.must) ids.push(t.must[Math.floor(rng() * t.must.length)]);
    while (ids.length < n) {
      const id = t.pool[Math.floor(rng() * t.pool.length)];
      if (!ids.includes(id)) ids.push(id);
    }
    const key = ids.slice().sort().join();
    if (seen.has(key)) continue;
    seen.add(key);
    const w = tableWidth(ids, cfg);
    if (w > 0 && w >= t.minW) cands.push({ ids, d: Math.abs(w - target) });
  }
  if (!cands.length) return [t.must ? t.must[0] : t.pool[0]];          // 見つからなければ1つだけ載せる
  cands.sort((a, b) => a.d - b.d);
  return cands[Math.floor(rng() * Math.min(t.top || 3, cands.length))].ids;
}

// そのテーブルの判定。全員の幅の重なり（最初の数テーブルは広げた幅）の中なら成功。
// per＝物ごとの判定（成功した物は残り、外れた物だけ遅い／速いで失敗する演出に使う）
function judgeTable(speed, ids, tableNo, cfg) {
  const ranges = ids.map(id => itemRange(cfg.items[id], tableNo, cfg));
  const range = combineRanges(ranges);
  const per = ranges.map(r => judge(speed, r, cfg));
  let result = 'ok', off = 0;
  if (speed < range.lo) { result = 'slow'; off = range.lo - speed; }
  else if (speed > range.hi) { result = 'fast'; off = speed - range.hi; }
  return { result, off, near: result === 'ok' && per.some(p => p.near), per, range };
}

// そのテーブル全体の成功の幅
function tableRange(ids, tableNo, cfg) { return combineRanges(ids.map(id => itemRange(cfg.items[id], tableNo, cfg))); }

// ---- 演出の選び方（褒め言葉・紙吹雪・節目） ----
// count＝この成功で何連続になるか。rng は 0〜1 の乱数。cls は見た目の大きさ（good → great → epic）
function praiseFor(count, near, rng, cfg) {
  const pick = a => a[Math.floor(rng() * a.length) % a.length];
  let tier = cfg.praise.ok[0];
  for (const t of cfg.praise.ok) if (count >= t.from) tier = t;
  const cls = count >= cfg.praise.ok[3].from ? 'epic' : (near || count >= cfg.praise.ok[2].from ? 'great' : 'good');
  return { text: near ? pick(cfg.praise.near) : pick(tier.words), cls };
}
function failWord(result, rng, cfg) { const a = cfg.praise[result]; return a[Math.floor(rng() * a.length) % a.length]; }
function isMilestone(count, cfg) { return count > 0 && count % cfg.praise.milestoneEvery === 0; }
// 紙吹雪の数：3連続から。連続数に比例、節目は倍
function confettiCount(count, cfg) {
  if (count < 3) return 0;
  const n = Math.min(cfg.praise.confettiMax, 8 + count * 3);
  return isMilestone(count, cfg) ? Math.min(cfg.praise.confettiMax * 1.5, n * 2) : n;
}
// 連続数に応じた連続数チップの光り方（0〜3）
function glowTier(count) { return count >= 20 ? 3 : count >= 12 ? 2 : count >= 5 ? 1 : 0; }
// 引いた瞬間の画面の揺れの強さ（速いほど強い）
function pullShake(speed, cfg) { return Math.min(cfg.shake.pullMax, speed * cfg.shake.pull); }
// ===== 検証（three.js を使わない純粋ロジック） =====
const $out = document.getElementById('out');
let nOk = 0, nNg = 0;
function check(name, cond, why) {
  const d = document.createElement('div'); d.className = 'r ' + (cond ? 'ok' : 'ng'); d.textContent = name;
  if (!cond) { nNg++; const w = document.createElement('div'); w.className = 'why'; w.textContent = why || ''; d.appendChild(w); } else nOk++;
  $out.appendChild(d);
}
const near = (x, y, e) => Math.abs(x - y) <= (e || 1e-9);

// ---- 速さの測り方 ----
// 0.1 秒で画面の 40% を等速でなぞる → 4
const fast = [0, 25, 50, 75, 100].map((t, i) => ({ t, x: .5, y: .5 + .1 * i }));
check('等速：0.1秒で画面の40% → 速さ4', near(measureSpeed(fast, CFG).speed, 4, 1e-6), String(measureSpeed(fast, CFG).speed));
check('距離は始点からの下向きの量', near(measureSpeed(fast, CFG).dist, 0.4, 1e-9));
const slow = Array.from({ length: 20 }, (_, i) => ({ t: i * 50, x: .5, y: .45 + .02 * i }));   // 1秒で 38% → 0.4/s
check('ゆっくりなぞる → 速さ0.4', near(measureSpeed(slow, CFG).speed, 0.4, 1e-6), String(measureSpeed(slow, CFG).speed));
const held = fast.concat([{ t: 400, x: .5, y: .9 }]);   // 最後は止めてから離した
check('止めてから離すと速さはほぼ0（直前の時間窓で測る）', measureSpeed(held, CFG).speed < 0.2, String(measureSpeed(held, CFG).speed));
const accel = [{ t: 0, x: .5, y: .5 }, { t: 400, x: .5, y: .55 }, { t: 450, x: .5, y: .8 }, { t: 500, x: .5, y: 1.0 }];
check('最後に加速 → 離す直前の速さで測る（平均より速い）', measureSpeed(accel, CFG).speed > 3.5, String(measureSpeed(accel, CFG).speed));
check('上向きになぞったら速さ0', measureSpeed([{ t: 0, x: .5, y: .8 }, { t: 100, x: .5, y: .5 }], CFG).speed === 0);
check('点が1つだけなら速さ0・距離0', (() => { const m = measureSpeed([{ t: 0, x: .5, y: .5 }], CFG); return m.speed === 0 && m.dist === 0; })());
check('点が2つで同時刻でも割り算で壊れない', Number.isFinite(measureSpeed([{ t: 5, x: .5, y: .5 }, { t: 5, x: .5, y: .6 }], CFG).speed));
check('短すぎる引きは「引いていない」', isShortPull(0.05, CFG) && !isShortPull(0.15, CFG));

// ---- 幅 ----
const g = CFG.items.glass;
check('最初の数テーブルは幅が広い（中心は同じ）', (() => {
  const a = itemRange(g, 0, CFG), b = itemRange(g, CFG.widenTables, CFG);
  return near((a.lo + a.hi) / 2, (b.lo + b.hi) / 2) && (a.hi - a.lo) > (b.hi - b.lo);
})());
check('widenTables を過ぎたら倍率だけの幅（中心は同じ）', (() => { const b = itemRange(g, CFG.widenTables, CFG), w = (g.hi - g.lo) * CFG.widthScale; return near(b.hi - b.lo, w) && near((b.lo + b.hi) / 2, (g.lo + g.hi) / 2); })());
check('幅の重なり：狭いほうに合う', (() => { const r = combineRanges([{ lo: 2, hi: 5 }, { lo: 3, hi: 7 }]); return r.lo === 3 && r.hi === 5 && !r.empty; })());
check('重なりがなければ empty', combineRanges([{ lo: 1, hi: 2 }, { lo: 3, hi: 4 }]).empty);
check('1つだけならその幅', (() => { const r = combineRanges([{ lo: 2, hi: 5 }]); return r.lo === 2 && r.hi === 5; })());

// ---- 判定 ----
const R = { lo: 2, hi: 5 };
check('幅より遅い → slow', judge(1.5, R, CFG).result === 'slow');
check('幅より速い → fast', judge(5.5, R, CFG).result === 'fast');
check('幅の中 → ok', judge(3.5, R, CFG).result === 'ok');
check('端ちょうどは ok', judge(2, R, CFG).result === 'ok' && judge(5, R, CFG).result === 'ok');
check('中央は ギリギリ ではない', !judge(3.5, R, CFG).near);
check('端の近くは ギリギリ', judge(2.1, R, CFG).near && judge(4.9, R, CFG).near);
check('外れた量が返る', near(judge(1.5, R, CFG).off, 0.5) && near(judge(6, R, CFG).off, 1));
check('幅が狭くても ギリギリ の最小幅がある', (() => { const n = { lo: 3, hi: 3.4 }; return judge(3.1, n, CFG).near && !judge(3.2, n, CFG).near; })());
check('設定の幅が速さメーターの中に収まる', Object.values(CFG.items).every(i => i.lo > 0 && i.hi < CFG.speedMax && i.lo < i.hi));
check('広げた最初の幅もメーターの中に収まる', Object.values(CFG.items).every(i => { const r = itemRange(i, 0, CFG); return r.lo > 0 && r.hi < CFG.speedMax; }));

// ---- メーター ----
check('メーター位置は0〜1に収まる', meterPos(-1, CFG) === 0 && meterPos(100, CFG) === 1 && near(meterPos(CFG.speedMax / 2, CFG), 0.5));

// ---- Phase 2：載る物の選び方・テーブルの判定 ----
function seeded(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
const tiersOk = (lo, hi, test) => { for (let st = lo; st < hi; st++) for (let seed = 1; seed <= 200; seed++) { const ids = pickTable(st, seeded(seed * 7919 + st), CFG); if (!test(ids, st)) return false; } return true; };
check('最初（0〜2連続）は1つだけ載る', tiersOk(0, 3, ids => ids.length === 1));
check('4〜7（3〜6連続）は2〜3個載る', tiersOk(3, 7, ids => ids.length >= 2 && ids.length <= 3));
check('8〜12（7〜11連続）はケーキかタワーが必ず載る', tiersOk(7, 12, ids => ids.includes('cake') || ids.includes('tower')));
check('同じ物が1つのテーブルに重複して載らない', tiersOk(0, 30, ids => new Set(ids).size === ids.length));
check('どのテーブルも幅の重なりがあり、tier の最小幅以上（理不尽な組み合わせが出ない）', tiersOk(0, 30, (ids, st) => {
  const r = tableRange(ids, 99, CFG), t = tierOf(st, CFG);   // 99＝広げない幅
  return !r.empty && (r.hi - r.lo >= t.minW - 1e-9 || ids.length === 1);
}));
check('載っている物は設定にある物だけ', tiersOk(0, 30, ids => ids.every(id => CFG.items[id])));
check('同じ乱数なら同じ組み合わせ（検証が再現できる）', JSON.stringify(pickTable(5, seeded(42), CFG)) === JSON.stringify(pickTable(5, seeded(42), CFG)));
check('7種類すべてがどこかで出る', (() => { const seen = new Set(); for (let st = 0; st < 40; st++) for (let s = 1; s < 60; s++) pickTable(st, seeded(s * 31 + st), CFG).forEach(i => seen.add(i)); return Object.keys(CFG.items).every(k => seen.has(k)); })());
check('軽い紙コップは速すぎるとダメ・重い鉄鍋は遅いとダメ（性格の差）', CFG.items.paperCup.hi < CFG.items.glass.hi && CFG.items.pot.lo > CFG.items.glass.lo);
check('紙コップと鉄鍋は同時に載らない（幅が重ならない）', combineRanges([CFG.items.paperCup, CFG.items.pot]).empty);
const jt = (sp, ids, no) => judgeTable(sp, ids, no === undefined ? 99 : no, CFG);
check('テーブル判定：重なりの中なら成功', jt(3.0, ['glass', 'plate']).result === 'ok');
check('テーブル判定：重い物と一緒だと、グラス単独で成功の速さでも遅くて失敗', jt(3.0, ['glass', 'pot']).result === 'slow' && judge(3.0, CFG.items.glass, CFG).result === 'ok');
check('テーブル判定：軽い物と一緒だと速すぎて失敗', jt(4.5, ['plate', 'paperCup']).result === 'fast');
check('テーブル判定：物ごとの結果が返る（外れた物だけ失敗）', (() => { const j = jt(3.0, ['glass', 'pot']); return j.per[0].result === 'ok' && j.per[1].result === 'slow'; })());
check('テーブル判定：全員成功なら全員 ok', jt(4.2, ['glass', 'plate', 'pot']).per.every(p => p.result === 'ok'));
check('テーブル判定：どれかがギリギリなら near', jt(1.9, ['paperCup', 'glass']).near && !jt(3.0, ['plate']).near);
check('失敗のときは near にならない', !jt(0.5, ['glass']).near);
check('最初の数テーブルは広い幅で判定される', jt(1.4, ['glass'], 0).result === 'ok' && jt(1.4, ['glass'], 5).result === 'slow');
check('tableRange は judgeTable の range と同じ', (() => { const a = tableRange(['glass', 'cake'], 2, CFG), b = jt(3, ['glass', 'cake'], 2).range; return a.lo === b.lo && a.hi === b.hi; })());

// ---- Phase 3：褒め言葉・紙吹雪・節目・揺れ ----
check('褒め言葉は連続数が増えるほど段階が上がる（大きさ good→great→epic）', (() => {
  const r = n => praiseFor(n, false, () => 0, CFG).cls;
  return r(1) === 'good' && r(7) === 'good' && r(8) === 'great' && r(12) === 'great' && r(13) === 'epic' && r(25) === 'epic';
})());
check('ギリギリは序盤でも great 以上で、専用の言葉', (() => { const p = praiseFor(2, true, () => 0, CFG); return p.cls === 'great' && CFG.praise.near.includes(p.text); })());
check('連続数に合った言葉が選ばれる（1連続に「神業」は出ない）', (() => { for (let s = 0; s < 50; s++) { const t = praiseFor(1, false, seeded(s + 1), CFG).text; if (CFG.praise.ok[0].words.indexOf(t) < 0) return false; } return true; })());
check('13連続以上では神業の言葉が出る', (() => { const t = praiseFor(14, false, () => 0, CFG).text; return CFG.praise.ok[3].words.includes(t); })());
check('乱数が 1.0 に近くても言葉の範囲を超えない', (() => { const t = praiseFor(5, false, () => 0.9999999, CFG).text; return typeof t === 'string' && t.length > 0; })());
check('失敗の言葉（遅い・速い）が選ばれる', CFG.praise.slow.includes(failWord('slow', () => 0.5, CFG)) && CFG.praise.fast.includes(failWord('fast', () => 0.5, CFG)));
check('節目は5の倍数（0は節目ではない）', isMilestone(5, CFG) && isMilestone(10, CFG) && !isMilestone(0, CFG) && !isMilestone(7, CFG));
check('紙吹雪：2連続まではなし・3連続から・連続数で増える・上限あり', confettiCount(2, CFG) === 0 && confettiCount(3, CFG) > 0 && confettiCount(4, CFG) > confettiCount(3, CFG) && confettiCount(99, CFG) <= CFG.praise.confettiMax * 1.5);
check('節目の紙吹雪は多い', confettiCount(10, CFG) > confettiCount(9, CFG) && confettiCount(10, CFG) > confettiCount(11, CFG));
check('連続数チップの光り方は 5/12/20 連続で段階が上がる', glowTier(4) === 0 && glowTier(5) === 1 && glowTier(12) === 2 && glowTier(20) === 3);
check('画面の揺れは速いほど強く、上限がある', pullShake(2, CFG) < pullShake(5, CFG) && pullShake(50, CFG) === CFG.shake.pullMax);
check('割れる物すべてに破片の色が決まっている', Object.keys(CFG.items).every(k => CFG.shard[k] && CFG.shard[k].length === 2));

// ---- 難しさの並び：簡単な順に、どんどん難しく ----
const avgW = (st, nSeed) => { let s = 0; for (let k = 1; k <= nSeed; k++) s += tableWidth(pickTable(st, seeded(k * 104729 + st), CFG), CFG); return s / nSeed; };
check('目標の幅は連続数が増えるほど狭くなる（単調に減る）', (() => { let p = Infinity; for (let s = 0; s <= 40; s++) { const w = targetWidth(s, CFG); if (w > p + 1e-9) return false; p = w; } return true; })());
check('目標の幅：0連続は広く、20連続以降は最後の値', targetWidth(0, CFG) === CFG.difficulty[0][1] && targetWidth(30, CFG) === CFG.difficulty[CFG.difficulty.length - 1][1]);
check('実際に出る幅の平均も連続数に応じて狭くなる（0→3→7→12→20）', (() => { const a = [0, 3, 7, 12, 20].map(s => avgW(s, 150)); return a.every((w, i) => i === 0 || w < a[i - 1]); })());
check('序盤（0〜2連続）に狭い幅は出ない（どの回も幅 2.8 以上）', tiersOk(0, 3, ids => tableWidth(ids, CFG) >= 2.8));
check('序盤（0〜2連続）は幅の広い順に並ぶ（平均が 0連続 ≧ 1連続 ≧ 2連続）', (() => { const a = [0, 1, 2].map(s => avgW(s, 200)); return a[0] >= a[1] - 1e-9 && a[1] >= a[2] - 1e-9; })());
check('3〜6連続でも幅 1.8 より狭い物は出ない', tiersOk(3, 7, ids => tableWidth(ids, CFG) >= 1.8));
check('20連続以降は狭い（幅の平均が 0連続の半分以下）', avgW(22, 150) <= avgW(0, 150) / 2);
check('どの回も幅の重なりがある（成功できる速さが存在する）', tiersOk(0, 40, ids => tableWidth(ids, CFG) > 0));
check('組み合わせは毎回同じにならない（同じ連続数でも複数の組み合わせが出る）', (() => { const set = new Set(); for (let k = 1; k <= 60; k++) set.add(pickTable(5, seeded(k * 7 + 1), CFG).slice().sort().join()); return set.size >= 3; })());

const sumEl = document.getElementById('sum');
sumEl.textContent = nNg === 0 ? ('全 ' + nOk + ' 件 PASS') : (nNg + ' 件 FAIL / ' + (nOk + nNg) + ' 件');
sumEl.style.color = nNg === 0 ? '#6bd07a' : '#ff6b6b';
</script>
