<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>テーブルクロス引き（仮）</title>
<style>
  :root{--u:3.75px;--ink:#2b2433;--bg:#2a1f3d;--jp:"Hiragino Kaku Gothic ProN","Yu Gothic","YuGothic","Meiryo","Noto Sans JP",sans-serif}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;overflow:hidden;background:#141018;color:var(--ink);font-family:var(--jp);touch-action:none;user-select:none;-webkit-user-select:none;overscroll-behavior:none;-webkit-touch-callout:none}
  html,body{height:100vh;height:100dvh}
  body{word-break:auto-phrase;overflow-wrap:anywhere;line-break:strict}
  p,h1,h2{text-wrap:balance}
  button{font-family:var(--jp);touch-action:manipulation;cursor:pointer}
  .nw{white-space:nowrap}
  .ph{display:inline-block}

  #stage{position:fixed;top:0;height:100vh;left:50%;transform:translateX(-50%);width:min(100vw,56.25vh);overflow:hidden;background:var(--bg);box-shadow:0 0 0 1px rgba(255,255,255,.08),0 0 60px rgba(0,0,0,.7);touch-action:none}
  @supports (height:100dvh){#stage{height:100dvh;width:min(100vw,56.25dvh)}}
  #view{position:absolute;inset:0;overflow:hidden}
  #view canvas{display:block;width:100%;height:100%}

  #hud{position:absolute;left:0;right:0;top:0;z-index:5;pointer-events:none;padding:calc(env(safe-area-inset-top) + var(--u)*2.5) calc(var(--u)*3) 0;opacity:0;transition:opacity .25s}
  #hud.on{opacity:1}
  .row{display:flex;gap:calc(var(--u)*2);align-items:stretch}
  .chip{display:flex;align-items:center;justify-content:center;gap:calc(var(--u)*1.4);padding:0 calc(var(--u)*3);height:calc(var(--u)*10);border-radius:calc(var(--u)*3);background:rgba(255,255,255,.9);box-shadow:0 2px 0 rgba(0,0,0,.2);font-weight:900;line-height:1.1;white-space:nowrap}
  .chip small{font-size:calc(var(--u)*2.8);letter-spacing:.1em;opacity:.65;font-weight:700}
  .chip b{font-size:calc(var(--u)*6.5);font-variant-numeric:tabular-nums}
  #streakBox{flex:1.4} #streakBox b{color:#e8590c}
  #bestBox{flex:1}
  #streakBox.bump{animation:bump .3s ease-out}
  @keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.2)}100%{transform:scale(1)}}
  .ibtn{pointer-events:auto;flex:none;width:calc(var(--u)*10);height:calc(var(--u)*10);border:0;border-radius:calc(var(--u)*3);background:rgba(255,255,255,.9);box-shadow:0 2px 0 rgba(0,0,0,.2);font-size:calc(var(--u)*4.4);font-weight:900;color:var(--ink)}
  .ibtn:active{transform:translateY(1px)}
  .ibtn.off{opacity:.55}

  /* 速さメーター（上部、HUD の下） */
  #meter{position:absolute;left:calc(var(--u)*5);right:calc(var(--u)*5);top:calc(env(safe-area-inset-top) + var(--u)*17);z-index:5;pointer-events:none;opacity:0;transition:opacity .2s}
  #meter.on{opacity:1}
  #meterBar{position:relative;height:calc(var(--u)*7);border-radius:calc(var(--u)*3.5);background:rgba(20,16,24,.72);box-shadow:0 2px 0 rgba(0,0,0,.25);overflow:hidden}
  #meterZone{position:absolute;top:0;bottom:0;background:linear-gradient(180deg,#8ff0a4,#37b24d);opacity:.95;display:none}
  #meterZone.pre{opacity:.55}
  #meterMark{position:absolute;top:0;bottom:0;width:calc(var(--u)*1.4);margin-left:calc(var(--u)*-.7);background:#fff;border-radius:calc(var(--u)*.7);box-shadow:0 0 calc(var(--u)*2) #fff;left:0}
  #meterMark.bad{background:#ff6b6b;box-shadow:0 0 calc(var(--u)*2) #ff6b6b}
  #meterLab{display:flex;justify-content:space-between;margin-top:calc(var(--u)*1.2);font-size:calc(var(--u)*3);font-weight:900;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.7)}

  #names{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top) + var(--u)*31);z-index:5;pointer-events:none;text-align:center;color:#fff;font-size:calc(var(--u)*3.6);font-weight:900;text-shadow:0 1px 4px rgba(0,0,0,.8);white-space:nowrap}
  #pops{position:absolute;left:50%;top:44%;z-index:6;pointer-events:none}
  .pop{position:absolute;left:0;transform:translateX(-50%);font-size:calc(var(--u)*11);font-weight:900;white-space:nowrap;-webkit-text-stroke:calc(var(--u)*.8) #fff;paint-order:stroke fill;animation:floatUp 1.2s ease-out forwards}
  .pop.good{color:#2b8a3e} .pop.great{color:#e8890c;font-size:calc(var(--u)*13)} .pop.bad{color:#e03131}
  @keyframes floatUp{0%{opacity:0;margin-top:calc(var(--u)*3);scale:.6}15%{opacity:1;scale:1.15}30%{scale:1}100%{opacity:0;margin-top:calc(var(--u)*-16)}}

  .pop.epic{color:#d6336c;font-size:calc(var(--u)*15)}
  .pop.mile{top:calc(var(--u)*-17);color:#7048e8;font-size:calc(var(--u)*13);animation-duration:1.5s}
  #streakBox.t1{background:#fff3bf;box-shadow:0 2px 0 rgba(0,0,0,.2),0 0 calc(var(--u)*2.5) #ffe066}
  #streakBox.t2{background:#ffd8a8;box-shadow:0 2px 0 rgba(0,0,0,.2),0 0 calc(var(--u)*3.5) #ff922b}
  #streakBox.t3{background:linear-gradient(135deg,#ffd43b,#ff8787,#da77f2);box-shadow:0 2px 0 rgba(0,0,0,.2),0 0 calc(var(--u)*5) #f783ac;animation:glowHue 1.2s linear infinite}
  #streakBox.t3.bump{animation:bump .3s ease-out,glowHue 1.2s linear infinite}
  @keyframes glowHue{0%{filter:hue-rotate(0)}100%{filter:hue-rotate(40deg)}}
  #confetti{position:absolute;inset:0;z-index:7;pointer-events:none;overflow:hidden}
  .cf{position:absolute;top:-4%;width:calc(var(--u)*2);height:calc(var(--u)*3.2);border-radius:calc(var(--u)*.3);animation:cfFall linear forwards}
  @keyframes cfFall{0%{transform:translate3d(0,0,0) rotate(0)}100%{transform:translate3d(var(--dx),calc(var(--u)*190),0) rotate(var(--rot))}}
  #hint{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + var(--u)*8);z-index:5;pointer-events:none;text-align:center;color:#fff;font-size:calc(var(--u)*4.4);font-weight:900;text-shadow:0 2px 6px rgba(0,0,0,.7);opacity:0;transition:opacity .2s}
  #hint.on{opacity:1}
  #hint .arrow{display:block;font-size:calc(var(--u)*9);animation:nudge 1s ease-in-out infinite}
  @keyframes nudge{0%,100%{transform:translateY(0)}50%{transform:translateY(calc(var(--u)*3))}}

  .screen{position:absolute;inset:0;z-index:10;display:none;flex-direction:column;align-items:center;justify-content:safe center;gap:calc(var(--u)*4);padding:calc(var(--u)*8);background:rgba(20,14,30,.72);color:#fff;text-align:center;overflow:auto}
  .screen.on{display:flex}
  .screen h1{font-size:calc(var(--u)*11);font-weight:900;line-height:1.25;text-shadow:0 3px 0 rgba(0,0,0,.4)}
  .screen h2{font-size:calc(var(--u)*8);font-weight:900}
  .screen p{font-size:calc(var(--u)*4.4);line-height:1.7;font-weight:700}
  #overNew{display:none;padding:calc(var(--u)*1) calc(var(--u)*5);border-radius:calc(var(--u)*5);background:#ff6b6b;color:#fff;font-weight:900;font-size:calc(var(--u)*5);animation:bump .5s ease-out}
  #overNew.on{display:block}
  .rank{font-size:calc(var(--u)*5.2);color:#ffd43b;font-weight:900}
  .sbtn{border:1px solid rgba(255,255,255,.45);background:transparent;color:#fff;border-radius:calc(var(--u)*4);padding:calc(var(--u)*1.8) calc(var(--u)*6);font-size:calc(var(--u)*3.8);font-weight:700}
  .sbtn:active{background:rgba(255,255,255,.15)}
  .big{font-size:calc(var(--u)*22);font-weight:900;color:#ffd43b;line-height:1;font-variant-numeric:tabular-nums}
  .btn{border:0;border-radius:calc(var(--u)*5);padding:calc(var(--u)*3.4) calc(var(--u)*10);font-size:calc(var(--u)*6);font-weight:900;background:#ffd43b;color:#3b2a00;box-shadow:0 calc(var(--u)*1) 0 #c99a00}
  .btn:active{transform:translateY(2px);box-shadow:0 calc(var(--u)*.4) 0 #c99a00}
</style>
</head>
<body>
<div id="stage">
  <div id="view"></div>
  <div id="hud">
    <div class="row">
      <div class="chip" id="streakBox"><small>連続</small><b id="streak">0</b></div>
      <div class="chip" id="bestBox"><small>自己ベスト</small><b id="best">0</b></div>
      <button class="ibtn" id="soundBtn" title="音の入り切り">♪</button>
      <button class="ibtn" id="zoneBtn" title="成功の幅を先に見せる／隠す">幅</button>
    </div>
  </div>
  <div id="meter">
    <div id="meterBar"><div id="meterZone"></div><div id="meterMark"></div></div>
    <div id="meterLab"><span>遅い</span><span id="meterVal"></span><span>速い</span></div>
  </div>
  <div id="names"></div>
  <div id="confetti"></div>
  <div id="pops"></div>
  <div id="hint"><span class="arrow">▼</span><span class="ph">下へ</span><span class="ph">ちょうどいい速さで</span><span class="ph">スワイプ</span></div>

  <div class="screen on" id="titleScr">
    <h1><span class="ph">テーブル</span><span class="ph">クロス引き</span><br><span class="nw" style="font-size:.5em">（仮）</span></h1>
    <p><span class="ph">ちょうどいい速さで</span><span class="ph">クロスを引き抜け。</span><br><span class="ph">遅いと引きずられ、</span><span class="ph">速いと跳ね上がる。</span></p>
    <p class="nw">自己ベスト <b id="titleBest">0</b> 連続</p>
    <button class="btn" id="startBtn">はじめる</button>
  </div>
  <div class="screen" id="overScr">
    <h2 id="overTitle">失敗…</h2>
    <p>連続成功</p>
    <div class="big" id="overScore">0</div>
    <div id="overNew">新記録！</div>
    <p class="nw rank" id="overRank"></p>
    <p class="nw" id="overBest"></p>
    <button class="btn" id="againBtn">もう一回</button>
    <button class="sbtn" id="shareBtn">Xで共有</button>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
"use strict";
// ===== 調整用の数値（遊んで直す） =====
// 速さの単位は「画面の高さ／秒」。例：画面の半分を 0.125 秒でなぞる＝ 4
const CFG = {
  speedMax: 9,            // 速さメーターの右端
  minPull: 0.10,          // これ未満しか引かなかったら「引いていない」扱い（画面の高さの割合）
  window: 0.10,           // 速さを測る時間窓＝指を離す直前の何秒か
  startY: 0.42,           // この高さ（画面上端からの割合）より下で指を置いたときだけ受け付ける
  nearRatio: 0.12,        // 幅の端からこの割合以内ならギリギリ
  nearMin: 0.15,          // ギリギリの最小幅（速さの単位）
  widthScale: 1.3,        // すべての物の成功の幅に掛ける倍率（難しさのつまみ。大きいほど易しい）
  widen: 1.4,             // 最初の数テーブルは幅を広げる倍率
  widenTables: 3,         // 広げるテーブル数
  showZoneDefault: true,  // 成功の幅を引く前から見せるか（「幅」ボタンで切り替え）
  items: {
    // lo〜hi が「ちょうどいい速さ」。遅いと引きずられ、速いと跳ねる
    // 軽い物は速すぎると飛ぶ（上限が低い）、重い物は速めでないと引きずる（下限が高い）、背が高い物は幅が狭い
    paperCup: { name: '紙コップ', lo: 1.4, hi: 3.6 },
    plate:    { name: 'お皿', lo: 2.0, hi: 5.6 },
    glass:    { name: 'グラス', lo: 2.2, hi: 5.0 },
    candle:   { name: 'ろうそく', lo: 2.6, hi: 4.4 },
    pot:      { name: '鉄鍋', lo: 4.0, hi: 7.2 },
    cake:     { name: 'ケーキ', lo: 2.8, hi: 4.8 },
    tower:    { name: 'シャンパンタワー', lo: 3.0, hi: 4.6 },
    // 13連続〜：高そうで壊れやすい物（幅が狭い）
    fishbowl: { name: '金魚の水槽', lo: 3.0, hi: 4.4 },
    vase:     { name: '高そうな花瓶', lo: 3.2, hi: 4.6 },
    cardTower:{ name: 'トランプタワー', lo: 3.3, hi: 4.3 },
    // 20連続〜：ばかばかしい物。soft＝割れずに「ぽんっ」と散る（猫・雪だるま）
    cat:      { name: '寝ている猫', lo: 2.8, hi: 4.4, soft: true },
    crown:    { name: '王様の冠', lo: 2.2, hi: 4.0 },
    snowman:  { name: '雪だるま', lo: 2.6, hi: 4.2, soft: true },
  },
  // 難しさの目標：[連続数, そのテーブル全体の成功の幅の目標]（間は直線でつなぐ。20連続以降は最後の値）。
  // 載る物は、tier の条件を満たす組み合わせのうち、この目標の幅に近いものを選ぶ → 連続するほど幅が狭くなる
  difficulty: [[0, 4.7], [1, 3.7], [2, 2.9], [3, 2.7], [7, 2.3], [12, 1.7], [20, 1.0]],
  // 連続成功数ごとの載る物。upTo＝この連続数未満のあいだ。top＝目標に近い上位何個からランダムに選ぶか（既定3。1なら毎回いちばん近いもの＝序盤は決まった順）、count＝物の数、must＝このうち1つは必ず入れる、
  // minW＝幅の重なりがこれ未満になる組み合わせは出さない（理不尽防止）
  tiers: [
    { upTo: 3,  count: [1, 1], pool: ['paperCup', 'plate', 'glass'], minW: 0, top: 1 },
    { upTo: 7,  count: [2, 3], pool: ['plate', 'glass', 'paperCup', 'candle', 'pot'], minW: 1.0 },
    { upTo: 12, count: [1, 3], pool: ['cake', 'tower', 'candle', 'glass', 'plate', 'paperCup', 'pot'], must: ['cake', 'tower'], minW: 0.8 },
    // 12〜19連続（13個目〜20個目）：高そうな物が必ず1つ入る
    { upTo: 20, count: [1, 3], pool: ['fishbowl', 'vase', 'cardTower', 'tower', 'cake', 'candle', 'glass', 'pot', 'plate'], must: ['fishbowl', 'vase', 'cardTower'], minW: 0.7 },
    // 20連続〜：ばかばかしい物が必ず1つ入る。あとはランダム
    { upTo: Infinity, count: [1, 3], pool: ['cat', 'crown', 'snowman', 'fishbowl', 'vase', 'cardTower', 'tower', 'cake', 'candle', 'glass', 'pot', 'plate', 'paperCup'], must: ['cat', 'crown', 'snowman'], minW: 0.6 },
  ],
  // 結果画面の称号：from 連続以上
  rank: [
    { from: 0,  name: 'はじめの一歩' }, { from: 3,  name: 'テーブル見習い' }, { from: 6,  name: 'クロス引き職人' },
    { from: 10, name: '宴会の達人' }, { from: 15, name: '神業の名人' }, { from: 20, name: '人間国宝' }, { from: 30, name: 'テーブルクロス王' },
  ],
  // X 共有：hashtag は「#」なし。url は公開したら入れる（空なら、いま開いているページの URL を使う）
  share: { hashtag: 'テーブルクロス引き', url: '' },
  // 褒め言葉：from 連続以上で使う。連続数が増えるほど大きく褒める。near はギリギリ成功のとき
  praise: {
    ok: [
      { from: 1,  words: ['お見事！', 'ナイス！', 'いい引き！'] },
      { from: 4,  words: ['すごい！', 'うまい！', 'さすが！'] },
      { from: 8,  words: ['天才！', '名人！', 'プロの技！'] },
      { from: 13, words: ['神業！', '伝説！', '人間国宝！'] },
      { from: 20, words: ['人間じゃない！', 'ありえない！', '世界一！'] },
    ],
    near: ['ギリギリ！', 'あぶなっ！', '神業！'],
    slow: ['ずるずる〜！', '遅すぎ！', '引きずった！'],
    fast: ['ロケット発射！', '速すぎ！', '飛んでった！'],
    milestoneEvery: 5,      // この連続数ごとに「N連続！」を大きく出す
    confettiMax: 80,        // 紙吹雪の最大数（3連続から出る）
  },
  // 割れたときの破片の色（[おもな色, 差し色]）
  shard: {
    paperCup: [0xffffff, 0xe8575a], plate: [0xf6efe3, 0xf29bb7], glass: [0xcfeeff, 0xff5d73], candle: [0xfff3d6, 0xffb43a],
    pot: [0x34353b, 0x888b94], cake: [0xfff0f3, 0xe03148], tower: [0xcfeeff, 0xffd86b],
    fishbowl: [0xcfeeff, 0xff8a1f], vase: [0xf4f7ff, 0x2f5fd0], cardTower: [0xffffff, 0xe03148],
    cat: [0xf2a65a, 0xfff3e0], crown: [0xffd43b, 0xe03148], snowman: [0xffffff, 0xff8a1f],
  },
  // 画面の揺れ（カメラ）：pull＝引いた瞬間（速さに比例）、shatter＝割れた瞬間、milestone＝節目
  shake: { pull: 0.012, pullMax: 0.1, shatter: 0.16, milestone: 0.08, decay: 5 },
  // 演出の時間（秒）
  // 引く動きの長さ＝ durK ÷ 速さ（秒）を durMin〜durMax に収める。遅く引くと布もゆっくり動く
  // ギリギリ成功のスロー：slowScale 倍の速さで slowTime 秒（実時間）。そのあと nearPopAt 秒で褒め、nearHold 秒で次へ
  fx: { enter: 0.38, okHold: 0.7, failHold: 0.5, durK: 1.0, durMin: 0.16, durMax: 1.2,
        slowScale: 0.3, slowTime: 1.0, nearPopAt: 0.95, nearHold: 1.5 },
  world: { tableTop: 1.0, tableW: 3.4, tableD: 2.0, drape: 1.0, clothW: 3.9, slideX: 9 },
  // カメラ：横の画角を固定して、斜め上から見下ろす
  cam: { hfov: 36, pos: [0, 5.0, 6.6], look: [0, 1.5, 0.3] },
};
// ===== 判定ロジック（three.js を使わない。verify.html で検証する） =====

// 指の軌跡から速さを測る。trail は [{t(ms), y(画面の高さに対する割合・下向きが正), x}]
// 戻り値：{speed（画面の高さ/秒）, dist（始点からの下向きの距離）}
function measureSpeed(trail, cfg) {
  const n = trail.length;
  if (n < 2) return { speed: 0, dist: 0 };
  const last = trail[n - 1];
  const dist = last.y - trail[0].y;
  let base = last;
  for (let i = n - 2; i >= 0; i--) {
    if (last.t - trail[i].t <= cfg.window * 1000) base = trail[i]; else break;
  }
  if (base === last) base = trail[n - 2];
  const dt = Math.max((last.t - base.t) / 1000, 0.008);
  return { speed: Math.max(0, (last.y - base.y) / dt), dist };
}

// 物の「ちょうどいい速さ」の幅。最初の数テーブルは中心を保ったまま広げる
function itemRange(def, tableNo, cfg) {
  const c = (def.lo + def.hi) / 2, w = def.hi - def.lo;
  const k = (cfg.widthScale || 1) * (tableNo < cfg.widenTables ? cfg.widen : 1);
  return { lo: c - w * k / 2, hi: c + w * k / 2 };
}

// 載っている物の幅の重なり。重なりがなければ empty
function combineRanges(ranges) {
  let lo = -Infinity, hi = Infinity;
  for (const r of ranges) { lo = Math.max(lo, r.lo); hi = Math.min(hi, r.hi); }
  return { lo, hi, empty: lo > hi };
}

// 判定：{ result: 'ok'|'slow'|'fast', near: ギリギリか, off: 幅から外れた量 }
function judge(speed, range, cfg) {
  if (speed < range.lo) return { result: 'slow', near: false, off: range.lo - speed };
  if (speed > range.hi) return { result: 'fast', near: false, off: speed - range.hi };
  const m = Math.max(cfg.nearMin, (range.hi - range.lo) * cfg.nearRatio);
  return { result: 'ok', near: Math.min(speed - range.lo, range.hi - speed) < m, off: 0 };
}

// 引いている長さが足りないか
function isShortPull(dist, cfg) { return dist < cfg.minPull; }

// 速さ→メーター上の位置（0〜1）
function meterPos(speed, cfg) { return Math.min(1, Math.max(0, speed / cfg.speedMax)); }

// ---- 載る物の選び方（連続成功数に応じたエスカレート） ----
function tierOf(streak, cfg) { return cfg.tiers.find(t => streak < t.upTo); }

// 連続成功数 streak のテーブルに載せる物の id の配列。rng は 0〜1 の乱数（検証では固定の乱数を渡す）
// 難しさの目標の幅（連続数 → そのテーブル全体の成功の幅）。cfg.difficulty の点の間を直線でつなぐ
function targetWidth(streak, cfg) {
  const d = cfg.difficulty;
  if (streak <= d[0][0]) return d[0][1];
  for (let i = 1; i < d.length; i++) {
    if (streak <= d[i][0]) { const k = (streak - d[i - 1][0]) / (d[i][0] - d[i - 1][0]); return d[i - 1][1] + (d[i][1] - d[i - 1][1]) * k; }
  }
  return d[d.length - 1][1];
}
// 載せる物の組み合わせのテーブル全体の成功の幅（倍率はかけ、最初の数テーブルの広げは含めない）
function tableWidth(ids, cfg) { const r = combineRanges(ids.map(id => itemRange(cfg.items[id], 99, cfg))); return r.empty ? 0 : r.hi - r.lo; }

// 条件を満たす組み合わせを集め、目標の幅に近い順の上位 t.top（既定3）個からランダムに1つ選ぶ（毎回同じにならないように）
function pickTable(streak, rng, cfg) {
  const t = tierOf(streak, cfg), target = targetWidth(streak, cfg), seen = new Set(), cands = [];
  for (let k = 0; k < 80; k++) {
    const n = Math.min(t.pool.length, t.count[0] + Math.floor(rng() * (t.count[1] - t.count[0] + 1)));
    const ids = [];
    if (t.must) ids.push(t.must[Math.floor(rng() * t.must.length)]);
    while (ids.length < n) {
      const id = t.pool[Math.floor(rng() * t.pool.length)];
      if (!ids.includes(id)) ids.push(id);
    }
    const key = ids.slice().sort().join();
    if (seen.has(key)) continue;
    seen.add(key);
    const w = tableWidth(ids, cfg);
    if (w > 0 && w >= t.minW) cands.push({ ids, d: Math.abs(w - target) });
  }
  if (!cands.length) return [t.must ? t.must[0] : t.pool[0]];          // 見つからなければ1つだけ載せる
  cands.sort((a, b) => a.d - b.d);
  return cands[Math.floor(rng() * Math.min(t.top || 3, cands.length))].ids;
}

// そのテーブルの判定。全員の幅の重なり（最初の数テーブルは広げた幅）の中なら成功。
// per＝物ごとの判定（成功した物は残り、外れた物だけ遅い／速いで失敗する演出に使う）
function judgeTable(speed, ids, tableNo, cfg) {
  const ranges = ids.map(id => itemRange(cfg.items[id], tableNo, cfg));
  const range = combineRanges(ranges);
  const per = ranges.map(r => judge(speed, r, cfg));
  let result = 'ok', off = 0;
  if (speed < range.lo) { result = 'slow'; off = range.lo - speed; }
  else if (speed > range.hi) { result = 'fast'; off = speed - range.hi; }
  return { result, off, near: result === 'ok' && per.some(p => p.near), per, range };
}

// そのテーブル全体の成功の幅
function tableRange(ids, tableNo, cfg) { return combineRanges(ids.map(id => itemRange(cfg.items[id], tableNo, cfg))); }

// ---- 演出の選び方（褒め言葉・紙吹雪・節目） ----
// count＝この成功で何連続になるか。rng は 0〜1 の乱数。cls は見た目の大きさ（good → great → epic）
function praiseFor(count, near, rng, cfg) {
  const pick = a => a[Math.floor(rng() * a.length) % a.length];
  let tier = cfg.praise.ok[0];
  for (const t of cfg.praise.ok) if (count >= t.from) tier = t;
  const cls = count >= cfg.praise.ok[3].from ? 'epic' : (near || count >= cfg.praise.ok[2].from ? 'great' : 'good');
  return { text: near ? pick(cfg.praise.near) : pick(tier.words), cls };
}
function failWord(result, rng, cfg) { const a = cfg.praise[result]; return a[Math.floor(rng() * a.length) % a.length]; }
function isMilestone(count, cfg) { return count > 0 && count % cfg.praise.milestoneEvery === 0; }
// 紙吹雪の数：3連続から。連続数に比例、節目は倍
function confettiCount(count, cfg) {
  if (count < 3) return 0;
  const n = Math.min(cfg.praise.confettiMax, 8 + count * 3);
  return isMilestone(count, cfg) ? Math.min(cfg.praise.confettiMax * 1.5, n * 2) : n;
}
// 連続数に応じた連続数チップの光り方（0〜3）
function glowTier(count) { return count >= 20 ? 3 : count >= 12 ? 2 : count >= 5 ? 1 : 0; }
// 引いた瞬間の画面の揺れの強さ（速いほど強い）
function pullShake(speed, cfg) { return Math.min(cfg.shake.pullMax, speed * cfg.shake.pull); }

// ---- 結果画面・共有 ----
// 称号（連続数に応じて）
function rankFor(streak, cfg) { let r = cfg.rank[0]; for (const x of cfg.rank) if (streak >= x.from) r = x; return r.name; }
// 失敗した物の名前（判定の per から）。例：['グラス', '鉄鍋']
function failedNames(ids, verdict, cfg) { return ids.filter((id, i) => verdict.per[i].result !== 'ok').map(id => cfg.items[id].name); }
// 失敗の見出し。例：「グラスと鉄鍋が引きずられて落ちた…」
function overTitle(names, result, allSoft) {
  const who = names.length ? names.join('と') + 'が' : '';
  return who + (result === 'slow' ? '引きずられて落ちた…' : allSoft ? '跳ね上がって散った…' : '跳ね上がって割れた…');
}
// 失敗した物がぜんぶ「割れない物」（猫・雪だるま）か
function failedAllSoft(ids, verdict, cfg) { const f = ids.filter((id, i) => verdict.per[i].result !== 'ok'); return f.length > 0 && f.every(id => cfg.items[id].soft); }
// X に投稿する文章（url が空なら文章だけ）
function shareText(streak, best, cfg, url) {
  const head = streak > 0 ? 'テーブルクロス引きで ' + streak + '連続成功！（' + rankFor(streak, cfg) + '）' : 'テーブルクロス引きに挑戦！';
  return head + (best > streak ? ' 自己ベスト' + best + '連続' : '') + ' #' + cfg.share.hashtag;
}
// PC 用：X の投稿画面を開く URL
function tweetUrl(text, url) { return 'https://twitter.com/intent/tweet?text=' + encodeURIComponent(text) + (url ? '&url=' + encodeURIComponent(url) : ''); }
// ===== 3D の場面：テーブル・クロス・物・割れる破片 =====
// 物理エンジンは使わない。結果は判定ロジックで先に決まっていて、ここはその結果に合う動きを再生するだけ。
// クロスは「経路（テーブルの上→手前の垂れ→床）」に沿って布の点が滑っていく作り。

const GRAV = 22;
const CLOTH_NX = 12, CLOTH_NM = 56;
const EDGE = CFG.world.tableD / 2;               // テーブル手前の縁の z
const TOP = CFG.world.tableTop;
const ITEM_Z0 = 0.3;                              // 物を置く z（縁寄りにして、引きずられると縁に届くように）
const CLOTH_LEN = CFG.world.tableD + CFG.world.drape + 0.1;
const OFFSET_END = 9.5;                           // 布がこれだけ滑ったら画面から消えている

const ease = { out: t => 1 - (1 - t) * (1 - t), inQ: t => Math.pow(t, 1.6) };

function buildWorld(scene) {
  scene.background = new THREE.Color(0x2a1f3d);
  const hemi = new THREE.HemisphereLight(0xfff4e0, 0x5a4470, 0.75);
  scene.add(hemi);
  const sun = new THREE.DirectionalLight(0xffffff, 0.85);
  sun.position.set(3, 7, 5);
  sun.castShadow = true;
  sun.shadow.mapSize.set(1024, 1024);
  const sc = sun.shadow.camera; sc.left = -6; sc.right = 6; sc.top = 6; sc.bottom = -6; sc.near = 1; sc.far = 20;
  scene.add(sun);
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshStandardMaterial({ color: 0x8a5a38, roughness: 0.85 }));
  floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true;
  scene.add(floor);
  const wall = new THREE.Mesh(new THREE.PlaneGeometry(40, 16), new THREE.MeshStandardMaterial({ color: 0x4a3470, roughness: 1 }));
  wall.position.set(0, 8, -6);
  scene.add(wall);
  // 壁のかざり（丸いランプ）
  for (let i = -2; i <= 2; i++) {
    const lamp = new THREE.Mesh(new THREE.SphereGeometry(0.28, 16, 12), new THREE.MeshBasicMaterial({ color: 0xffe9a8 }));
    lamp.position.set(i * 2.2, 4.2, -5.8);
    scene.add(lamp);
  }
}

let _clothTex = null;
function clothTexture() {
  if (_clothTex) return _clothTex;
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d');
  g.fillStyle = '#fbf6ee'; g.fillRect(0, 0, 128, 128);
  g.fillStyle = '#e8575a'; g.fillRect(0, 0, 64, 64); g.fillRect(64, 64, 64, 64);
  _clothTex = new THREE.CanvasTexture(c);
  _clothTex.wrapS = _clothTex.wrapT = THREE.RepeatWrapping;
  _clothTex.repeat.set(4, CLOTH_LEN / (CFG.world.clothW / 4));
  return _clothTex;
}

// 布の経路上の位置：s は経路に沿った長さ（0＝テーブルの奥の縁）
function pathAt(s, progress, whip) {
  const D = CFG.world.tableD, H = CFG.world.drape;
  if (s <= D) return { y: TOP + 0.012, z: -D / 2 + s };
  if (s <= D + H) {
    const k = (s - D) / H;
    return { y: TOP - (s - D) + 0.012 * (1 - k), z: EDGE + 0.14 * Math.sin(Math.PI * Math.min(1, k * 1.15)) + 0.012 };
  }
  const f = s - D - H;
  const y = 0.02 + Math.max(0, 0.5 * whip * progress * Math.sin(f * 1.9)) * Math.min(1, f);
  return { y, z: EDGE + 0.012 + f };
}

function buildGlass() {
  const g = new THREE.Group();
  const pts = [[0, 0], [0.26, 0], [0.26, 0.035], [0.04, 0.075], [0.04, 0.5], [0.12, 0.62], [0.3, 0.78], [0.3, 1.18], [0.27, 1.18], [0.27, 0.8], [0.0, 0.72]]
    .map(p => new THREE.Vector2(p[0], p[1]));
  const body = new THREE.Mesh(new THREE.LatheGeometry(pts, 24),
    new THREE.MeshStandardMaterial({ color: 0xcfeeff, transparent: true, opacity: 0.55, roughness: 0.1, metalness: 0.1, side: THREE.DoubleSide }));
  body.castShadow = true;
  g.add(body);
  const juice = new THREE.Mesh(new THREE.CylinderGeometry(0.255, 0.18, 0.28, 20), new THREE.MeshStandardMaterial({ color: 0xff5d73, roughness: 0.4 }));
  juice.position.y = 0.92;
  g.add(juice);
  g.scale.setScalar(0.95);
  g.userData.radius = 0.3;
  return g;
}
function std(color, o) { return new THREE.MeshStandardMaterial(Object.assign({ color, roughness: 0.6 }, o || {})); }
function castAll(g) { g.traverse(o => { if (o.isMesh) o.castShadow = true; }); return g; }
function add(g, geo, mat, x, y, z) { const m = new THREE.Mesh(geo, mat); m.position.set(x || 0, y || 0, z || 0); g.add(m); return m; }

// 紙コップ：軽い。白に赤い縞
function buildPaperCup() {
  const g = new THREE.Group();
  add(g, new THREE.CylinderGeometry(0.27, 0.19, 0.5, 20), std(0xffffff, { roughness: 0.9 }), 0, 0.25, 0);
  add(g, new THREE.CylinderGeometry(0.262, 0.222, 0.14, 20), std(0xe8575a, { roughness: 0.9 }), 0, 0.26, 0);
  add(g, new THREE.TorusGeometry(0.27, 0.025, 8, 20), std(0xf1ece0), 0, 0.5, 0).rotation.x = Math.PI / 2;
  return castAll(g);
}
// お皿：平たい。ドーナツつき
function buildPlate() {
  const g = new THREE.Group();
  add(g, new THREE.CylinderGeometry(0.5, 0.36, 0.07, 28), std(0xf6efe3, { roughness: 0.3 }), 0, 0.035, 0);
  add(g, new THREE.CylinderGeometry(0.3, 0.3, 0.02, 24), std(0xdbe7f7, { roughness: 0.3 }), 0, 0.075, 0);
  const d = add(g, new THREE.TorusGeometry(0.13, 0.065, 12, 20), std(0xf29bb7, { roughness: 0.5 }), 0, 0.15, 0);

  return castAll(g);
}
// ろうそく：細くて背が高い。炎つき

// 鉄鍋：重い。黒くて低い。取っ手つき
function buildPot() {

  const h = add(g, new THREE.TorusGeometry(0.1, 0.035, 8, 14), std(0x34353b, { metalness: 0.6 }), 0.5, 0.42, 0); h.rotation.y = Math.PI / 2;
  return castAll(g);
}
// ケーキ：3段。いちごが載る
function buildCake() {

  const cream = std(0xfff0f3, { roughness: 0.7 }), sponge = std(0xf3c98b, { roughness: 0.8 });

  add(g, new THREE.CylinderGeometry(0.51, 0.51, 0.1, 28), cream, 0, 0.3, 0);
  add(g, new THREE.CylinderGeometry(0.38, 0.38, 0.26, 28), sponge, 0, 0.48, 0);
  add(g, new THREE.CylinderGeometry(0.39, 0.39, 0.09, 28), cream, 0, 0.64, 0);

  add(g, new THREE.CylinderGeometry(0.27, 0.27, 0.08, 28), cream, 0, 0.93, 0);
  add(g, new THREE.SphereGeometry(0.1, 12, 10), std(0xe03148, { roughness: 0.4 }), 0, 1.03, 0);

}
// シャンパンタワー：段になった皿を細い脚で重ねる
function buildTower() {
  const g = new THREE.Group();
  const glassM = std(0xcfeeff, { transparent: true, opacity: 0.6, roughness: 0.1 });
  add(g, new THREE.CylinderGeometry(0.22, 0.26, 0.04, 20), glassM, 0, 0.02, 0);
  const tiers = [[0.5, 0.32], [0.36, 0.7], [0.22, 1.06]];
  for (const [r, y] of tiers) {
    add(g, new THREE.CylinderGeometry(0.035, 0.035, 0.34, 8), glassM, 0, y - 0.18, 0);
    add(g, new THREE.CylinderGeometry(r, r * 0.55, 0.12, 22), glassM, 0, y, 0);
    add(g, new THREE.CylinderGeometry(r * 0.88, r * 0.88, 0.04, 22), std(0xffd86b, { roughness: 0.3 }), 0, y + 0.04, 0);
  }
  add(g, new THREE.SphereGeometry(0.06, 10, 8), std(0xffd86b), 0, 1.2, 0);
  return castAll(g);
}
const ITEM_BUILDERS = { glass: buildGlass, paperCup: buildPaperCup, plate: buildPlate, candle: buildCandle, pot: buildPot, cake: buildCake, tower: buildTower };

function buildTable() {
  const g = new THREE.Group();
  const wood = new THREE.MeshStandardMaterial({ color: 0x5b3a22, roughness: 0.7 });
  const top = new THREE.Mesh(new THREE.BoxGeometry(CFG.world.tableW, 0.12, CFG.world.tableD), wood);
  top.position.y = TOP - 0.06; top.castShadow = true; top.receiveShadow = true;
  g.add(top);
  for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
    const leg = new THREE.Mesh(new THREE.BoxGeometry(0.14, TOP - 0.12, 0.14), wood);
    leg.position.set(sx * (CFG.world.tableW / 2 - 0.15), (TOP - 0.12) / 2, sz * (CFG.world.tableD / 2 - 0.15));
    leg.castShadow = true;
    g.add(leg);
  }
  return g;
}

function buildClothMesh() {
  const nx = CLOTH_NX, nm = CLOTH_NM;
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array((nx + 1) * (nm + 1) * 3);
  const uv = new Float32Array((nx + 1) * (nm + 1) * 2);
  const idx = [];
  for (let j = 0; j <= nm; j++) for (let i = 0; i <= nx; i++) {
    const k = j * (nx + 1) + i;
    uv[k * 2] = i / nx; uv[k * 2 + 1] = j / nm;
    if (i < nx && j < nm) { const a = k, b = k + 1, c = k + nx + 1, d = k + nx + 2; idx.push(a, c, b, b, c, d); }
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
  geo.setIndex(idx);
  const mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ map: clothTexture(), side: THREE.DoubleSide, roughness: 0.95 }));
  mesh.castShadow = true; mesh.receiveShadow = true; mesh.frustumCulled = false;
  return mesh;
}

// ---- 1テーブル分 ----
function makeRound(itemIds) {
  const group = new THREE.Group();
  group.add(buildTable());
  const cloth = buildClothMesh();
  group.add(cloth);
  const shardsGroup = new THREE.Group();
  group.add(shardsGroup);

  const n = itemIds.length, spread = n === 1 ? 0 : n === 2 ? 0.75 : 1.15;   // 物を横に並べる（2つ＝±0.75、3つ＝±1.15）
  const items = itemIds.map((id, k) => {
    const mesh = ITEM_BUILDERS[id]();
    const x = n === 1 ? 0 : -spread + 2 * spread * k / (n - 1);
    const it = { id, mesh, x, y: TOP, z: ITEM_Z0 + (n > 1 && k % 2 ? -0.25 : 0), rx: 0, rz: 0, vx: 0, vy: 0, vz: 0, wx: 0, wz: 0, mode: 'rest', wob: 0, wobAmp: 0, t: 0 };
    group.add(mesh);
    return it;
  });

  const R = {
    group, items,
    phase: 'idle',        // idle → pulling → done
    offset: 0, pt: 0, dur: 1, verdict: null, speed: 0,
    shards: [], shattered: false, settled: false, onShatter: null, onSettle: null,
    elapsed: 0, whip: 1,
  };

  function writeCloth() {
    const pa = cloth.geometry.attributes.position.array;
    const prog = Math.min(1, R.offset / 3);
    const hw = CFG.world.clothW / 2;
    for (let j = 0; j <= CLOTH_NM; j++) {
      const m = j / CLOTH_NM * CLOTH_LEN;
      const p = pathAt(m + R.offset, prog, R.whip);
      for (let i = 0; i <= CLOTH_NX; i++) {
        const k = (j * (CLOTH_NX + 1) + i) * 3;
        const u = i / CLOTH_NX * 2 - 1;
        const flare = m + R.offset > CFG.world.tableD + CFG.world.drape ? 1 + 0.25 * prog : 1;
        pa[k] = u * hw * flare;
        pa[k + 1] = p.y + (m + R.offset > CFG.world.tableD ? 0.05 * u * u * prog : 0);
        pa[k + 2] = p.z;
      }
    }
    cloth.geometry.attributes.position.needsUpdate = true;
    cloth.geometry.computeVertexNormals();
  }
  writeCloth();

  function syncItem(it) {
    it.mesh.position.set(it.x, it.y, it.z);
    it.mesh.rotation.set(it.rx, 0, it.rz);
  }
  items.forEach(syncItem);

  function shatter(it) {
    it.mode = 'gone'; it.mesh.visible = false;
    const n = 26, sc = CFG.shard[it.id] || [0xcfeeff, 0xff5d73];
    for (let i = 0; i < n; i++) {
      const sz = 0.05 + Math.random() * 0.08;
      const m = new THREE.Mesh((CFG.items[it.id] && CFG.items[it.id].soft) ? new THREE.SphereGeometry(sz * 1.1, 8, 6) : new THREE.BoxGeometry(sz, sz * 0.5, sz * 1.4),   // 猫・雪だるまは割れずにふわっと散る
        new THREE.MeshStandardMaterial({ color: i % 4 === 0 ? sc[1] : sc[0], transparent: true, opacity: 0.9 }));
      m.position.set(it.x, Math.max(it.y, 0.05) + 0.2, it.z);
      const a = Math.random() * Math.PI * 2, sp = 1 + Math.random() * 2.6;
      shardsGroup.add(m);
      R.shards.push({ m, vx: Math.cos(a) * sp, vy: 2 + Math.random() * 3.5, vz: Math.sin(a) * sp, wx: (Math.random() - .5) * 14, wz: (Math.random() - .5) * 14, life: 1.6 });
    }
    R.shattered = true;
    if (R.onShatter) R.onShatter(it);
  }

  function updateItem(it, dt, clothVel) {
    it.t += dt;
    if (it.mode === 'rest') {
      it.wob += dt;
      it.rz = it.wobAmp * Math.exp(-2.6 * it.wob) * Math.sin(17 * it.wob);
      it.rx = it.wobAmp * 0.6 * Math.exp(-2.6 * it.wob) * Math.sin(13 * it.wob + 1);
    } else if (it.mode === 'drag') {
      it.z += clothVel * 0.92 * dt;
      it.rx = Math.min(0.5, Math.max(0, (it.z - ITEM_Z0)) * 0.25);
      it.rz = Math.sin(it.t * 30) * 0.05;
      if (R.offset > ITEM_Z0 + EDGE + 0.1 && it.z < EDGE) { it.mode = 'rest'; it.wobAmp = 0.3; it.wob = 0; }   // 引きずられきらず取り残された（まず起きない）
      if (it.z > EDGE + 0.02) { it.mode = 'fall'; it.vz = clothVel * 0.6; it.vy = 0; it.wx = 3.5; }
    } else if (it.mode === 'hop') {
      it.vy -= GRAV * dt; it.y += it.vy * dt;
      if (it.y <= TOP) { it.y = TOP; it.mode = 'rest'; it.wob = 0; }
    } else if (it.mode === 'launch' || it.mode === 'fall') {
      it.vy -= GRAV * dt; it.y += it.vy * dt; it.z += it.vz * dt; it.x += it.vx * dt;
      it.rx += it.wx * dt; it.rz += it.wz * dt;
      const overTable = Math.abs(it.z) < EDGE + 0.05 && Math.abs(it.x) < CFG.world.tableW / 2;
      if (overTable && it.y <= TOP && it.vy < 0) { it.y = TOP; shatter(it); }
      else if (it.y <= 0.02) { it.y = 0.02; shatter(it); }
    }
    syncItem(it);
  }

  R.pull = function (speed, verdict) {
    R.speed = speed; R.verdict = verdict; R.whip = Math.min(1.6, 0.6 + 0.14 * speed); R.phase = 'pulling'; R.pt = 0;
    R.dur = Math.min(CFG.fx.durMax, Math.max(CFG.fx.durMin, CFG.fx.durK / Math.max(speed, 0.5)));
    // 物ごとの判定（verdict.per）で動きが決まる。全部成功ならギリギリの物ほど大きく揺れ、一部だけ外れたら外れた物だけ失敗する
    items.forEach((it, k) => {
      const v = verdict.per[k];
      if (v.result === 'ok') {
        it.mode = 'hop'; it.vy = v.near ? 1.2 : 2.4; it.wobAmp = v.near ? 0.42 : 0.14; it.wob = 0;
      } else if (v.result === 'slow') {
        it.mode = 'drag';
      } else {
        it.mode = 'launch';
        it.vy = 8.5 + Math.min(4, v.off) * 0.6; it.vz = 0.5 + Math.random() * 1.2; it.vx = (Math.random() - .5) * 1.2;
        it.wx = 5 + Math.random() * 3; it.wz = (Math.random() - .5) * 8;
      }
    });
  };

  R.update = function (dt) {
    R.elapsed += dt;
    let clothVel = 0;
    if (R.phase === 'pulling') {
      const prev = R.offset;
      R.pt = Math.min(1, R.pt + dt / R.dur);
      R.offset = OFFSET_END * ease.inQ(R.pt);
      clothVel = (R.offset - prev) / Math.max(dt, 1e-4);
      writeCloth();
      if (R.pt >= 1) { R.phase = 'done'; cloth.visible = false; }
    }
    for (const it of items) if (it.mode !== 'gone') updateItem(it, dt, clothVel);
    for (let i = R.shards.length - 1; i >= 0; i--) {
      const s = R.shards[i];
      s.life -= dt;
      s.vy -= GRAV * dt;
      s.m.position.x += s.vx * dt; s.m.position.y += s.vy * dt; s.m.position.z += s.vz * dt;
      const floorY = (Math.abs(s.m.position.z) < EDGE && Math.abs(s.m.position.x) < CFG.world.tableW / 2 && s.m.position.y > TOP - 0.3) ? TOP : 0.03;
      if (s.m.position.y < floorY) { s.m.position.y = floorY; s.vy *= -0.3; s.vx *= 0.7; s.vz *= 0.7; s.wx *= 0.6; s.wz *= 0.6; }
      s.m.rotation.x += s.wx * dt; s.m.rotation.z += s.wz * dt;
      if (s.life < 0.5) s.m.scale.setScalar(Math.max(0.01, s.life / 0.5));
      if (s.life <= 0) { shardsGroup.remove(s.m); s.m.geometry.dispose(); s.m.material.dispose(); R.shards.splice(i, 1); }
    }
  };

  R.dispose = function () {
    group.traverse(o => { if (o.geometry) o.geometry.dispose(); if (o.material && o.material !== cloth.material) o.material.dispose(); });
    cloth.material.dispose();
  };
  return R;
}

// 高そうな花瓶：白地に青い帯、金のふち、花つき

  add(g, new THREE.CylinderGeometry(0.415, 0.405, 0.1, 28), std(0x2f5fd0, { roughness: 0.3 }), 0, 0.45, 0);

// トランプタワー：A 字に立てかけたカードを3段
function buildCardTower() {
  const g = new THREE.Group();
  const card = std(0xffffff, { roughness: 0.5 }), back = std(0xe03148, { roughness: 0.5 });
  const cw = 0.36, ch = 0.5, lean = 0.34, tiers = 3;
  for (let t = 0; t < tiers; t++) {
    const n = tiers - t, y = t * (ch * Math.cos(lean) + 0.02), width = n * 0.34;
    for (let i = 0; i < n; i++) {
      const cx = -width / 2 + 0.17 + i * 0.34;
      for (const s of [-1, 1]) {
        const m = add(g, new THREE.BoxGeometry(cw, ch, 0.012), (i + t) % 2 ? back : card, cx + s * 0.085, y + ch / 2 * Math.cos(lean) + 0.01, 0);
        m.rotation.z = -s * lean;
        m.rotation.y = 0.0;
      }
    }
    // 段の天板
    if (n > 0) add(g, new THREE.BoxGeometry(width + 0.1, 0.012, cw), card, 0, y + ch * Math.cos(lean) + 0.02, 0);
  }
  return castAll(g);
}

// 寝ている猫：丸まったオレンジの猫。目は閉じ、しっぽを巻く
function buildCat() {

  }
  add(g, new THREE.SphereGeometry(0.03, 8, 6), std(0xe8758a), 0.64, 0.34, 0.1);
  const tail = add(g, new THREE.TorusGeometry(0.3, 0.07, 10, 20, Math.PI * 1.3), fur, -0.1, 0.12, 0.22); tail.rotation.x = Math.PI / 2; tail.rotation.z = 2.4;
  for (let i = 0; i < 3; i++) add(g, new THREE.BoxGeometry(0.06, 0.012, 0.012), std(0xd9822b), -0.1 + i * 0.12, 0.52 - Math.abs(i - 1) * 0.02, 0);   // しま
  return castAll(g);

// 王様の冠：金の輪、とがった先、宝石、赤いクッション
function buildCrown() {
  const g = new THREE.Group();
  const gold = std(0xffd43b, { metalness: 0.8, roughness: 0.25 });
  add(g, new THREE.CylinderGeometry(0.34, 0.38, 0.12, 24), std(0xb3243c, { roughness: 0.9 }), 0, 0.06, 0);
  add(g, new THREE.CylinderGeometry(0.3, 0.3, 0.22, 24, 1, true), gold, 0, 0.23, 0).material.side = THREE.DoubleSide;
  const gems = [0xe03148, 0x339af0, 0x51cf66, 0xda77f2, 0xff922b];
  for (let i = 0; i < 5; i++) {
    const a = i / 5 * Math.PI * 2, x = Math.cos(a) * 0.27, z = Math.sin(a) * 0.27;

    add(g, new THREE.SphereGeometry(0.035, 8, 6), std(gems[(i + 2) % 5], { roughness: 0.2 }), Math.cos(a) * 0.3, 0.23, Math.sin(a) * 0.3);
  }
  return castAll(g);
}

// 雪だるま：2段の雪玉、にんじんの鼻、ボタン、黒い帽子
function buildSnowman() {
  const g = new THREE.Group();

// ===== 効果音（Web Audio で合成。音源ファイルなし） =====
// 使えない環境・まだ操作がない状態では何もしない（遊びは止まらない）
const SFX = (function () {
  let ctx = null, master = null, noiseBuf = null, muted = false;
  try { muted = localStorage.getItem('tablecloth-pull-mute') === '1'; } catch (e) { }

  // iPhone は Web Audio だけだとサイレントスイッチで消音される。無音の <audio> を回しておくと「メディア再生」扱いになり、スイッチに関係なく鳴る
  let keep = null;
  function startKeepAlive() {
    try {
      const n = 4000, b = new Uint8Array(44 + n), v = new DataView(b.buffer);   // 8kHz・8bit・モノラルの無音 WAV
      const w = (o, s) => { for (let i = 0; i < s.length; i++) b[o + i] = s.charCodeAt(i); };
      w(0, 'RIFF'); v.setUint32(4, 36 + n, true); w(8, 'WAVEfmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
      v.setUint32(24, 8000, true); v.setUint32(28, 8000, true); v.setUint16(32, 1, true); v.setUint16(34, 8, true); w(36, 'data'); v.setUint32(40, n, true);
      b.fill(128, 44);
      keep = document.createElement('audio');
      keep.src = URL.createObjectURL(new Blob([b], { type: 'audio/wav' }));
      keep.loop = true; keep.setAttribute('playsinline', '');
      const p = keep.play(); if (p && p.catch) p.catch(() => { keep = null; });
    } catch (e) { keep = null; }
  }
  function unlock() {                         // 操作のたびに呼ぶ（iPhone などは操作の中でしか音を出せない。pointerdown では足りず、離したとき・タップ完了のときに有効になる）
    try {
      if (!ctx) {
        ctx = new (window.AudioContext || window.webkitAudioContext)();
        master = ctx.createGain(); master.gain.value = muted ? 0 : 0.8; master.connect(ctx.destination);
        noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 1.5, ctx.sampleRate);
        const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      }
      if (ctx.state !== 'running') {
        ctx.resume();

  }
  function setMuted(m) {
    muted = m; try { localStorage.setItem('tablecloth-pull-mute', m ? '1' : '0'); } catch (e) { }

  }
  const ok = () => ctx && ctx.state === 'running' && !muted;

  // 雑音：filter の周波数を f0→f1 に動かし、vol で鳴らして dur 秒で消える
  function noise(type, f0, f1, dur, vol, delay, q) {

    f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);

    g.gain.exponentialRampToValueAtTime(vol, t + Math.min(0.02, dur / 3)); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(master);
    s.start(t, Math.random()); s.stop(t + dur + 0.05);
  }
  // 音程：f0→f1
  function tone(type, f0, f1, dur, vol, delay) {
    if (!ok()) return;
    const t = ctx.currentTime + (delay || 0);
    const o = ctx.createOscillator(); o.type = type;
    o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.015); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.05);

  // 歓声：連続数が増えるほど長く・大きく・拍手が増える
  function cheer(level) {
    const l = Math.min(10, level);

    slowmo() { tone('sine', 220, 55, 0.7, 0.35); },                      // ギリギリのスロー：低くうなる
    drag() { noise('lowpass', 500, 220, 0.6, 0.45, 0, 2); },             // 引きずられる
    launch() { tone('sine', 280, 1400, 0.45, 0.22); noise('bandpass', 1200, 3000, 0.4, 0.15); },   // ロケットのように飛ぶ
    shatter(kind) {

      if (kind === 'snowman') { noise('lowpass', 900, 200, 0.4, 0.4); tone('sine', 300, 120, 0.3, 0.2); return; }                                              // ぼふっ
      if (kind === 'crown') { for (let i = 0; i < 6; i++) tone('triangle', 1800 + Math.random() * 2500, 1500, 0.2, 0.12, Math.random() * 0.25); noise('highpass', 4000, 7000, 0.15, 0.2); return; }   // 金属のチャリーン
      for (let i = 0; i < 10; i++) noise('highpass', 3000 + Math.random() * 2500, 6000, 0.07, 0.3, Math.random() * 0.22, 0.8);
      if (kind === 'pot') { tone('square', 190, 90, 0.35, 0.28); noise('lowpass', 900, 200, 0.3, 0.4); }          // 鉄鍋はガラスでなくガシャン
      else if (kind === 'cake') { noise('lowpass', 700, 150, 0.25, 0.4); tone('sine', 180, 60, 0.25, 0.3); }      // ケーキはぐしゃ
      else { for (let i = 0; i < 4; i++) tone('sine', 2200 + Math.random() * 2800, 2000, 0.12, 0.12, Math.random() * 0.2); }
    },
    fail() { [392, 330, 262, 196].forEach((f, i) => tone('triangle', f, f * 0.96, 0.28, 0.22, 0.25 + i * 0.16)); },   // しょんぼりした下降
    blip() { tone('sine', 660, 990, 0.12, 0.25); },                      // 「♪」を押したときの確認音
    milestone() { [523, 659, 784, 1047, 1319].forEach((f, i) => tone('square', f, f, 0.12, 0.12, i * 0.06)); cheer(10); },
  };
})();

  let enterT = 0, resT = 0, popped = false, advanced = false, failAt = 0, drag = null, nextIds = null;
  let showZone = CFG.showZoneDefault;

  const hud = $('hud'), meter = $('meter'), mZone = $('meterZone'), mMark = $('meterMark'), mVal = $('meterVal'), hint = $('hint');

  function refreshHud() {
    $('streak').textContent = streak; $('best').textContent = best; $('titleBest').textContent = best;
    $('streakBox').className = 'chip t' + glowTier(streak);
  }
  function pop(text, cls) {
    const d = document.createElement('div'); d.className = 'pop ' + cls; d.textContent = text;
    $('pops').appendChild(d); setTimeout(() => d.remove(), 1250);
  }
  function confetti(n) {
    const box = $('confetti'), cols = ['#ff6b6b', '#ffd43b', '#51cf66', '#339af0', '#da77f2', '#ff922b'];
    for (let i = 0; i < n; i++) {
      const d = document.createElement('div'); d.className = 'cf';
      d.style.left = (Math.random() * 100) + '%'; d.style.background = cols[i % cols.length];
      d.style.setProperty('--dx', ((Math.random() - 0.5) * 30) + 'vw'); d.style.setProperty('--rot', (360 + Math.random() * 720) + 'deg');
      d.style.animationDuration = (1.4 + Math.random() * 1.2) + 's'; d.style.animationDelay = (Math.random() * 0.25) + 's';
      box.appendChild(d); setTimeout(() => d.remove(), 3200);
    }
  }
  function showNames(ids) { $('names').textContent = ids.map(id => CFG.items[id].name).join('・'); }
  function setZoneView() {
    $('zoneBtn').classList.toggle('off', !showZone);
    if (!range || range.empty) { mZone.style.display = 'none'; return; }
    mZone.style.left = (range.lo / CFG.speedMax * 100) + '%';
    mZone.style.width = ((range.hi - range.lo) / CFG.speedMax * 100) + '%';
    mZone.classList.toggle('pre', state === 'aim' || state === 'enter');
    mZone.style.display = (showZone || state === 'resolve' || state === 'over') ? 'block' : 'none';
  }
  function setMark(speed, bad) {
    mMark.style.left = (meterPos(speed, CFG) * 100) + '%';
    mMark.classList.toggle('bad', !!bad);
    mVal.textContent = '速さ ' + speed.toFixed(1);
  }
  $('soundBtn').classList.toggle('off', SFX.isMuted());
  $('soundBtn').addEventListener('click', e => { e.stopPropagation(); SFX.unlock(); SFX.setMuted(!SFX.isMuted()); $('soundBtn').classList.toggle('off', SFX.isMuted()); if (!SFX.isMuted()) setTimeout(SFX.blip, 80); });
  for (const ev of ['pointerdown', 'pointerup', 'touchend', 'click']) addEventListener(ev, () => SFX.unlock(), { capture: true });
  $('zoneBtn').addEventListener('click', e => { e.stopPropagation(); showZone = !showZone; setZoneView(); });

  function spawnRound() {
    const ids = nextIds || pickTable(streak, Math.random, CFG);
    nextIds = null;
    range = tableRange(ids, streak, CFG);
    round = makeRound(ids);
    round.ids = ids;
    round.onShatter = it => { SFX.shatter(it.id); shake(CFG.shake.shatter); };
    showNames(ids);
    round.group.position.x = CFG.world.slideX;
    scene.add(round.group);
    state = 'enter'; enterT = 0; popped = false; advanced = false;
    mMark.style.left = '0%'; mMark.classList.remove('bad'); mVal.textContent = '';
    mMark.style.opacity = 0;
    setZoneView();
    meter.classList.add('on'); hint.classList.remove('on');
  }

  function startGame() {
    $('titleScr').classList.remove('on'); $('overScr').classList.remove('on');
    streak = 0; refreshHud();
    hud.classList.add('on');
    if (outgoing) { scene.remove(outgoing.group); outgoing.dispose(); outgoing = null; }
    if (round) { scene.remove(round.group); round.dispose(); round = null; }
    spawnRound();
  }

  let lastResult = { streak: 0, best: 0, title: '' };

  // ---- X 共有：スマホは画像つき（Web Share API）、PC は X の投稿画面（文章＋URL。画像は自動では付けられない） ----
  function resultCanvas() {
    const c = document.createElement('canvas'); c.width = 1080; c.height = 1350;
    const g = c.getContext('2d'), F = '"Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif';
    const bg = g.createLinearGradient(0, 0, 0, 1350); bg.addColorStop(0, '#3b2a5c'); bg.addColorStop(1, '#1d1530');
    g.fillStyle = bg; g.fillRect(0, 0, 1080, 1350);
    for (let i = 0; i < 60; i++) { g.fillStyle = ['#ff6b6b', '#ffd43b', '#51cf66', '#339af0', '#da77f2'][i % 5]; g.save(); g.translate((i * 197) % 1080, (i * 331) % 1350); g.rotate(i); g.fillRect(0, 0, 18, 30); g.restore(); }
    g.textAlign = 'center'; g.fillStyle = '#fff'; g.font = '900 64px ' + F; g.fillText('テーブルクロス引き（仮）', 540, 190);
    g.fillStyle = '#ffd43b'; g.font = '900 360px ' + F; g.fillText(String(lastResult.streak), 540, 700);
    g.fillStyle = '#fff'; g.font = '900 72px ' + F; g.fillText('連続成功', 540, 810);
    g.fillStyle = '#ffd43b'; g.font = '900 64px ' + F; g.fillText('称号：' + rankFor(lastResult.streak, CFG), 540, 930);
    g.fillStyle = '#fff'; g.font = '700 48px ' + F; g.fillText(lastResult.title, 540, 1030);
    g.fillStyle = '#c9c0e0'; g.font = '700 44px ' + F; g.fillText('自己ベスト ' + lastResult.best + ' 連続', 540, 1110);
    g.fillText('#' + CFG.share.hashtag, 540, 1250);
    return c;
  }
  async function share() {
    const url = CFG.share.url || (/^https?:/.test(location.href) ? location.href.split('#')[0] : '');
    const text = shareText(lastResult.streak, lastResult.best, CFG, url);
    if (matchMedia('(pointer: coarse)').matches && navigator.share && navigator.canShare) {
      try {
        const blob = await new Promise(r => resultCanvas().toBlob(r, 'image/png'));
        const file = new File([blob], 'tablecloth-pull.png', { type: 'image/png' });
        if (navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], text: text + (url ? ' ' + url : '') }); return; }
      } catch (e) { if (e && e.name === 'AbortError') return; }
    }
    window.open(tweetUrl(text, url), '_blank', 'noopener');
  }
  $('shareBtn').addEventListener('click', share);

  function gameOver(kind) {
    state = 'over';
    SFX.fail();
    const isNew = streak > best;
    if (isNew) { best = streak; saveBest(); }
    refreshHud();
    const names = failedNames(round.ids, round.verdict, CFG), title = overTitle(names, kind, failedAllSoft(round.ids, round.verdict, CFG));
    $('overTitle').textContent = title;
    $('overScore').textContent = streak;
    $('overNew').classList.toggle('on', isNew);
    $('overRank').textContent = '称号：' + rankFor(streak, CFG);
    $('overBest').textContent = '自己ベスト ' + best + ' 連続';
    lastResult = { streak, best, title };
    $('overScr').classList.add('on');
    hint.classList.remove('on');
  }

  // 引いた結果をここで決める（指を離した瞬間）
  function commitPull(speed) {
    const verdict = judgeTable(speed, round.ids, streak, CFG);
    round.pull(speed, verdict);
    SFX.whip(speed); shake(pullShake(speed, CFG));
    if (verdict.result === 'slow') setTimeout(SFX.drag, 120); else if (verdict.result === 'fast') setTimeout(SFX.launch, 60);
    else if (verdict.near) setTimeout(SFX.slowmo, 150);
    state = 'resolve'; resT = 0; popped = false; advanced = false; failAt = 0;
    round.verdict = verdict;
    setMark(speed, verdict.result !== 'ok');
    mMark.style.opacity = 1;
    setZoneView();
    hint.classList.remove('on');
  }

  // ---- 入力：画面の下側で下へスワイプ ----
  function pt(e) {
    const r = stage.getBoundingClientRect();
    return { t: e.timeStamp, x: (e.clientX - r.left) / r.height, y: (e.clientY - r.top) / r.height };
  }
  stage.addEventListener('pointerdown', e => {
    if (state !== 'aim' || e.target.closest('button')) return;
    const p = pt(e);
    if (p.y < CFG.startY) return;
    drag = { id: e.pointerId, trail: [p] };
    try { stage.setPointerCapture(e.pointerId); } catch (er) { }
    mMark.style.opacity = 1;
  });
  stage.addEventListener('pointermove', e => {
    if (!drag || e.pointerId !== drag.id) return;
    drag.trail.push(pt(e));
    const m = measureSpeed(drag.trail, CFG);
    setMark(m.speed, false);
  });
  function release(e, cancel) {
    if (!drag || e.pointerId !== drag.id) return;
    const d = drag; drag = null;
    if (cancel || state !== 'aim') return;
    d.trail.push(pt(e));
    const m = measureSpeed(d.trail, CFG);
    if (isShortPull(m.dist, CFG)) {
      pop('もっと引いて', 'bad'); mMark.style.opacity = 0; return;
    }
    commitPull(m.speed);
  }
  stage.addEventListener('pointerup', e => release(e, false));
  stage.addEventListener('pointercancel', e => release(e, true));
  $('startBtn').addEventListener('click', startGame);
  $('againBtn').addEventListener('click', startGame);

  // ---- メインループ ----
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (outgoing) {
      outgoing.update(dt);
      outgoing.group.position.x -= dt * 22;
      if (outgoing.group.position.x < -CFG.world.slideX) { scene.remove(outgoing.group); outgoing.dispose(); outgoing = null; }
    }
    if (round) {
      const slowNear = state === "resolve" && round.verdict && round.verdict.result === "ok" && round.verdict.near && resT < CFG.fx.slowTime;
      round.update(slowNear ? dt * CFG.fx.slowScale : dt);
      if (state === "enter") {
        enterT += dt;
        const k = Math.min(1, enterT / CFG.fx.enter);
        round.group.position.x = CFG.world.slideX * (1 - ease.out(k));
        if (k >= 1) { state = 'aim'; hint.classList.add('on'); setZoneView(); }
      } else if (state === 'resolve') {
        resT += dt;
        const v = round.verdict;
        if (v.result === 'ok') {
          if (!popped && resT > (v.near ? CFG.fx.nearPopAt : 0.28)) {
            popped = true;
            streak++; refreshHud();
            const sb = $('streakBox'); sb.classList.remove('bump'); void sb.offsetWidth; sb.classList.add('bump');
            const pr = praiseFor(streak, v.near, Math.random, CFG);
            pop(pr.text, pr.cls);
            if (v.near) SFX.near(); else SFX.success(streak);
            confetti(confettiCount(streak, CFG));
            if (isMilestone(streak, CFG)) { pop(streak + '連続！', 'mile'); SFX.milestone(); shake(CFG.shake.milestone); }
          }
          if (!advanced && resT > (v.near ? CFG.fx.nearHold : CFG.fx.okHold)) {
            advanced = true;
            outgoing = round; spawnRound();
          }
        } else {
          if (!popped && resT > 0.12) { popped = true; pop(failWord(v.result, Math.random, CFG), 'bad'); }
          if (round.shattered && !failAt) failAt = resT;
          if ((failAt && resT > failAt + CFG.fx.failHold) || resT > 3.5) gameOver(v.result);
        }
      }
    }
    if (shakeAmp > 0.0005) {                                  // 画面の揺れ：だんだん収まる
      camera.position.set(C.pos[0] + (Math.random() - .5) * shakeAmp * 2, C.pos[1] + (Math.random() - .5) * shakeAmp * 2, C.pos[2]);
      camera.lookAt(C.look[0], C.look[1], C.look[2]);
      shakeAmp *= Math.exp(-CFG.shake.decay * dt);
    } else if (shakeAmp > 0) { shakeAmp = 0; camera.position.set(C.pos[0], C.pos[1], C.pos[2]); camera.lookAt(C.look[0], C.look[1], C.look[2]); }
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  refreshHud();
  requestAnimationFrame(frame);

  // 検証用：スワイプなしで、指定の速さで引いたことにする
  window.__tc = {
    shareImage: () => resultCanvas().toDataURL(),
    setResult: r => { lastResult = r; },
    spawn: ids => { if (round) { scene.remove(round.group); round.dispose(); } nextIds = ids; spawnRound(); },
    pull: s => { if (state === 'aim') commitPull(s); return state; },
    state: () => ({ state, streak, best, range, shattered: round && round.shattered }),
  };
})();
</script>
</body>
</html>
